name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string
      is_prerelease:
        description: 'Mark as pre-release'
        required: true
        default: false
        type: boolean

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish Windows x64
        run: |
          dotnet publish src/JsonContentTranslator.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugSymbols=false `
            -p:DebugType=none `
            -p:Version=${{ inputs.release_tag }} `
            -o ./publish/windows-x64
          Get-ChildItem -Path "./publish/windows-x64" -Filter "*.pdb" -Recurse -File | Remove-Item -Force

      - name: Create Windows ZIP
        run: Compress-Archive -Path "./publish/windows-x64/*" -DestinationPath "./JsonContentTranslator-Windows-x64.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: ./JsonContentTranslator-Windows-x64.zip


  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish macOS ARM64
        run: |
          dotnet publish src/JsonContentTranslator.csproj -c Release -r osx-arm64 --self-contained true \
            -p:PublishSingleFile=true \
            -p:DebugSymbols=false \
            -p:DebugType=none \
            -p:Version=${{ inputs.release_tag }} \
            -o ./publish/macos-arm64
          find ./publish/macos-arm64 -name "*.pdb" -delete

      - name: Create macOS ZIP
        run: zip -r ./JsonContentTranslator-macOS-arm64.zip ./publish/macos-arm64

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: ./JsonContentTranslator-macOS-arm64.zip


  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish Linux x64
        run: |
          dotnet publish src/JsonContentTranslator.csproj -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true \
            -p:DebugSymbols=false \
            -p:DebugType=none \
            -p:Version=${{ inputs.release_tag }} \
            -o ./publish/linux-x64
          find ./publish/linux-x64 -name "*.pdb" -delete

      - name: Create Linux tar.gz
        run: tar -czf ./JsonContentTranslator-Linux-x64.tar.gz -C ./publish/linux-x64 .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: ./JsonContentTranslator-Linux-x64.tar.gz


  create-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          prerelease: ${{ inputs.is_prerelease }}
          generate_release_notes: true
          files: |
            ./artifacts/windows-x64/JsonContentTranslator-Windows-x64.zip
            ./artifacts/macos-arm64/JsonContentTranslator-macOS-arm64.zip
            ./artifacts/linux-x64/JsonContentTranslator-Linux-x64.tar.gz
